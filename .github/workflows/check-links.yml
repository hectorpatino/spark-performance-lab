name: Revisar enlaces

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"   # lunes, 06:17 en Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 403 se acepta porque algunos sitios de documentación bloquean a los robots de CI;
      # lo que interesa detectar son los 404 (páginas movidas o borradas).
      - name: Revisar enlaces de las páginas
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,403,429
            --exclude "fonts.googleapis.com|fonts.gstatic.com"
            --exclude "%7B%7B|\\{\\{"
            "*.html"
          fail: true
