name: Revisar enlaces

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"   # lunes, 06:17 en Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar enlaces externos de las páginas
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude "fonts.googleapis.com|fonts.gstatic.com"
            "*.html" "_includes/*.html"
          fail: true
