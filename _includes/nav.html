<nav class="tabs" aria-label="Páginas"><div class="row">
{%- assign nav_group = "" -%}
{%- for p in site.data.pages -%}
  {%- if p.section != nav_group -%}<span class="grp">{{ p.section }}</span>{%- assign nav_group = p.section -%}{%- endif -%}
  <a href="{{ p.slug | append: '.html' | relative_url }}"{% if p.slug == page.slug %} aria-current="page"{% endif %}>{{ p.title }}</a>
{%- endfor -%}
</div></nav>
